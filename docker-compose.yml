services:
  crm-database:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-database
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA:-Y}"
      SA_PASSWORD: "${SA_PASSWORD:-CrmDev2026!Secure#Pass}"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-CrmDev2026!Secure#Pass}"
      DB_NAME: "${DB_NAME:-CRMDatabase}"
    ports:
      - "${DB_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
